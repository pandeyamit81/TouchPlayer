# TouchPlayer MPD Configuration
# This file is used to configure MPD for TouchPlayer

# Audio output routed through PipeWire; device selection is done via the
# PipeWire default sink (see Settings > Audio Output).
audio_output {
    type        "pipewire"
    name        "PipeWire Output"
    mixer_type  "software"
}

# Database
db_file    "/var/lib/mpd/tag_cache"
log_file   "/var/log/mpd/mpd.log"
pid_file   "/run/mpd/pid"
state_file "/var/lib/mpd/state"

# Music directory
music_directory "/home/pi"
playlist_directory "/var/lib/mpd/playlists"

# Bind to localhost
bind_to_address "localhost"
port "6600"

# Log level
log_level "default"

# Audio buffer settings
audio_buffer_size "4096"
